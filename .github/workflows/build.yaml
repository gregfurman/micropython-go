name: Regenerate bindings

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'micropython'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: regenerate-bindings
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: 4
      GO_FLAGS: "-shuffle=on -race"
      BRANCH_NAME: regenerate-bindings-${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    - name: Tags
      run: git -C micropython fetch --tags --depth 1 origin

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Cache toolchain
      id: toolchain
      uses: actions/cache@v4
      with:
        path: tools
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.sh') }}

    - name: Toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      run: make tools

    - name: Generate and test bindings
      run: make wasm2go

    - name: Attest generated bindings
      uses: actions/attest@v4
      with:
        subject-path: |
          internal/micropython/micropython.go
          internal/micropython/micropython.dat
          internal/micropython/libc.go

    - name: Check generated changes
      id: changes
      run: |
        git add -- \
          internal/micropython/micropython.go \
          internal/micropython/micropython.dat \
          internal/micropython/libc.go

        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git diff --cached --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify main has not advanced
      if: steps.changes.outputs.changed == 'true'
      run: |
        current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
        if [[ "$current" != "$GITHUB_SHA" ]]; then
          echo "::error::main advanced during generation; run Regenerate bindings on the latest main."
          exit 1
        fi

    - name: Create regeneration commit
      if: steps.changes.outputs.changed == 'true'
      run: |
        gh auth setup-git
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git switch -c "$BRANCH_NAME"
        git commit -m "chore: regenerate wasm2go bindings"

    - name: Push regeneration branch
      if: steps.changes.outputs.changed == 'true'
      run: |
        git push origin "$BRANCH_NAME"

    - name: Create regeneration PR
      id: pr
      if: steps.changes.outputs.changed == 'true'
      run: |
        url=$(gh pr create \
          --title "chore: regenerate wasm2go bindings" \
          --body "Regenerated from $GITHUB_SHA on $RUNNER_OS/$RUNNER_ARCH" \
          --head "$BRANCH_NAME" \
          --base main \
          --label autogenerated-bindings)
        echo "$url"
        echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

    - name: Close superseded regeneration PRs
      if: steps.changes.outputs.changed == 'true'
      env:
        NEW_PR: ${{ steps.pr.outputs.number }}
      run: |
        EXISTING_PRS=$(gh pr list --label autogenerated-bindings --base main \
          --state open --author 'app/github-actions' --json number,isCrossRepository \
          --jq '.[] | select(.isCrossRepository == false) | .number')

        for pr in $EXISTING_PRS; do
          if [[ "$pr" != "$NEW_PR" ]]; then
            echo "Closing superseded regeneration PR #$pr"
            gh pr close "$pr" --comment "Closing in favor of newer regeneration PR #$NEW_PR."
          fi
        done
