name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'build/**'
      - 'micropython'
      - 'internal/micropython/**'
      - 'tools.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'build/**'
      - 'micropython'
      - 'internal/micropython/**'
      - 'tools.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

jobs:
  build:
    name: wasm2go bindings
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Cache toolchain
      id: toolchain
      uses: actions/cache@v4
      with:
        path: tools
        key: toolchain-${{ runner.os }}-${{ hashFiles('tools.sh') }}

    - name: Toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      run: make tools

    - name: Build
      run: make wasm2go

    - name: Versions
      run: |
        ./tools/wasi-sdk/bin/clang --version | head -1
        ./tools/binaryen/bin/wasm-opt --version
        cat build/build-embed/genhdr/mpversion.h

    - name: Verify
      run: |
        git add -A -- internal/micropython
        git diff --cached --stat --exit-code -- internal/micropython || { >&2 echo "Generated files in internal/micropython are out of date. Run 'make wasm2go' and commit the result."; exit 1; }

    # So a mismatch can be diffed against the committed bytes instead of guessed at.
    - name: Upload
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rebuilt
        path: |
          internal/micropython/micropython.go
          internal/micropython/micropython.dat
          build/build-embed/genhdr/mpversion.h
