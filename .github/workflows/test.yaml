name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: 4
      GO_FLAGS: "-shuffle=on -race"
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    - name: Tags
      run: git -C micropython fetch --tags --depth 1 origin

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Deps
      run: |
        make deps
        git diff --exit-code -- go.mod go.sum || { >&2 echo "Stale go.{mod,sum} detected. This can be fixed with 'make deps'."; exit 1; }

    - name: Cache toolchain
      id: toolchain
      uses: actions/cache@v4
      with:
        path: tools
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.sh') }}

    - name: Toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      run: make tools

    - name: Generate bindings
      run: make wasm2go

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      env:
        CGO_ENABLED: 0
      with:
        version: v2.13.2
        args: --timeout=10m

    - name: Test
      run: make test
