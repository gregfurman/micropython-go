name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        args: --timeout=10m

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      GOMAXPROCS: 4
      GOFLAGS: "-shuffle=on -race"
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Deps
      run: make deps && git diff-index --quiet HEAD || { >&2 echo "Stale go.{mod,sum} detected. This can be fixed with 'make deps'."; exit 1; }

    - name: Test
      run: make test
